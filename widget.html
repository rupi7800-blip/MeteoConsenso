<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meteo · widget</title>
  <meta name="theme-color" content="#0E1B33">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: grid; place-items: start center; padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 14px; }
    .wdg { width: min(420px, 100%); background: var(--card); border: 1px solid var(--bordo); border-radius: 26px; padding: 16px; text-decoration: none; color: inherit; display: block; }
    .wdg .r1 { display: flex; align-items: center; gap: 10px; }
    .wdg .r1 .t { font-size: 54px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
    .wdg .r1 .l { margin-left: auto; text-align: right; }
    .wdg .r1 .l b { display: block; font-size: 17px; }
    .wdg .r1 .l small { color: var(--tenue); font-size: 12.5px; }
    .wdg .r2 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 12px; text-align: center; font-size: 12.5px; }
    .wdg .r2 .n { color: var(--tenue); text-transform: capitalize; }
    .wdg .r2 .p { color: #9CCBFF; font-size: 11px; min-height: 13px; }
    .wdg .pie { display: flex; justify-content: space-between; color: var(--tenue); font-size: 11.5px; margin-top: 10px; }
    .azw { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  </style>
</head>
<body class="tema-parziale">
  <a class="wdg" id="wdg" href="./"><div class="carica" style="padding:30px 0">Carico il meteo…</div></a>
  <div class="azw"><span data-update-slot></span><button class="tondo" id="rw" title="Aggiorna dati" aria-label="Aggiorna dati">⟳</button></div>
  <script src="js/fonti.js"></script>
  <script src="js/icone.js"></script>
  <script src="js/widget.js"></script>
  <script src="js/aggiornamenti.js" data-version="1.0.1" defer></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  </script>
</body>
</html>
